###############################################
# AMCL (Localization)
###############################################

amcl:
  ros__parameters:

    use_sim_time: False              # 실제 로봇이므로 False

    base_frame_id: "base_link"       # 로봇 기준 프레임
    odom_frame_id: "odom"            # 오도메트리 프레임
    global_frame_id: "map"           # 맵 기준 프레임

    scan_topic: scan                 # LiDAR topic scan_fixed -> scan 20260312
    tf_broadcast: True               # AMCL이 map→odom TF 발행

    # 파티클 필터 개수 (정확도 vs CPU)
    min_particles: 500
    max_particles: 2000

    # 위치 업데이트 조건
    update_min_d: 0.10               # 10cm 이동 시 업데이트
    update_min_a: 0.10               # 약 10도 회전 시 업데이트

    transform_tolerance: 0.5         # TF 지연 허용


###############################################
# Behavior Tree Navigator
###############################################

bt_navigator:
  ros__parameters:

    use_sim_time: False

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    # Nav2 기본 행동 트리
    default_bt_xml_filename: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"



###############################################
# Global Planner
###############################################

planner_server:
  ros__parameters:

    use_sim_time: False

    planner_plugins: ["GridBased"]

    GridBased:

      # SMAC Planner (A* 개선형)
      plugin: "nav2_smac_planner::SmacPlanner2D"

      tolerance: 0.25                # 목표 근처 허용 오차
      allow_unknown: True            # unknown 영역 통과 허용

      downsample_costmap: false      # Costmap 해상도 그대로 사용

      max_iterations: 100000         # 탐색 최대 반복
      max_on_approach_iterations: 1000



###############################################
# Local Controller
###############################################

controller_server:
  ros__parameters:

    use_sim_time: false

    use_realtime_priority: false
    
    controller_frequency: 20.0       # 제어 루프 (Hz)

    #################################
    # Progress checker
    #################################

    progress_checker_plugins: ["progress_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10     # 10cm 이동
      movement_time_allowance: 5.0       # 5초 안에 이동 못하면 실패


    #################################
    # Controller plugin
    #################################

    controller_plugins: ["FollowPath"]

    FollowPath:

      # Pure Pursuit Controller (산업용에서 많이 사용)
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      #################################
      # 속도 설정
      #################################

      desired_linear_vel: 0.20  #0.25       # 목표 속도  평소 desired_linear_vel 달리다가 최대 max_vel_x 로 달림

      max_vel_x: 0.22 #0.15 #0.22              # 최대 전진 속도
      min_vel_x: 0.1 #-0.05                 # 후진 

      max_vel_theta: 1.5             # 최대 회전 속도
      min_speed_theta: 0.7           # 최소 회전 속도

      #################################
      # 가속 제한
      #################################

      acc_lim_x: 0.8
      decel_lim_x: -0.8

      acc_lim_theta: 2.0
      decel_lim_theta: -2.0


      #################################
      # 예측 시간
      #################################

      sim_time: 1.5                  # 1.5초 미래 예측


      #################################
      # TF 지연 허용
      #################################

      transform_tolerance: 0.2

      # 🔥 좁은길 안정성
      use_collision_detection: true
      regulate_linear_velocity: true

      # 🔥 벽 접근 시 감속
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0

      #################################
      # 속도 샘플 개수
      #################################
      # RegulatedPurePursuitController 에서는 사용 안함
      # vx_samples: 10
      # vtheta_samples: 40             # CPU 여유 있으면 40


      #################################
      # 옴니 로봇용 (차동이면 영향 거의 없음)
      #################################

      # min_speed_xy: 0.0
      # max_speed_xy: 0.22
      # min_speed_theta: 0.0


      #################################
      # Goal checker
      #################################

      goal_checker_plugins: ["goal_checker"]

      goal_checker:

        plugin: "nav2_controller::SimpleGoalChecker"

        stateful: True
        xy_goal_tolerance: 0.15      # 목표 위치 오차
        yaw_goal_tolerance: 0.2      # 목표 방향 오차


###############################################
# Local Costmap
###############################################

local_costmap:
  local_costmap:
    ros__parameters:
      # footprint: "[[0.22,0.18],[0.22,-0.18],[-0.22,-0.18],[-0.22,0.18]]"
      footprint: "[[0.20,0.16],[0.20,-0.16],[-0.20,-0.16],[-0.20,0.16]]"

      use_sim_time: False

      update_frequency: 15.0   # 최소 10 이상 추천      

      global_frame: odom #odom -> base_link 20260321 -> odom 20260324
      robot_base_frame: base_link

      rolling_window: True           # 로봇 중심 이동 창

      width: 5
      height: 5

      resolution: 0.05               # costmap 해상도

      robot_radius: 0.16             # 로봇 반지름

      plugins:
        - obstacle_layer
        - human_layer 
        - inflation_layer
  


      #################################
      # Obstacle Layer
      #################################

      obstacle_layer:

        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:

          topic: /scan                #/scan_fixed
          data_type: "LaserScan"

          clearing: True
          marking: True

          qos_overrides:
            reliability: best_effort

          obstacle_min_range: 0.20
          obstacle_max_range: 2.5     # 2.5m까지 장애물 생성

          raytrace_min_range: 0.20
          raytrace_max_range: 3.0


      #################################
      # Inflation Layer
      #################################

      inflation_layer:

        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.3        # 장애물 영향 반경 # ← 이거 크면 길 다 막힘
        cost_scaling_factor: 5.0     # 장애물 주변의 “위험도 증가 속도

        transform_tolerance: 1.0
      always_send_full_costmap: true   # 🔥 이거 추가
# | inflation_radius | cost_scaling_factor | 결과    |
# | ---------------- | ------------------- | ----- |
# | 작음              | 큼                   | 벽 가까이 |
# | 큼                | 작음                 | 벽 멀리  |
# | 큼                | 큼                  | 자연    |
# | 작음              | 작음                 | 이상함   |

      human_layer:
        plugin: "human_n_obstacle_layer::HumanLayer"



###############################################
# Global Costmap
###############################################

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: False

      update_frequency: 5.0   # 최소 5 이상 추천

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05

      rolling_window: False           # 로봇 중심 이동 창


      track_unknown_space: False

      robot_radius: 0.16

      plugins:
        - static_layer
        - human_layer
        - inflation_layer
      #################################
      # Static map layer
      #################################

      static_layer:

        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: True


      #################################
      # Inflation layer
      #################################

      inflation_layer:

        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.30 # 0.7 -> 0.3 20260330
        cost_scaling_factor: 5.0

        transform_tolerance: 1.0

      human_layer:
        plugin: "human_n_obstacle_layer::HumanLayer"


